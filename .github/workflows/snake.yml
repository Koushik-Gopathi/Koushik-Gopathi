name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#eb1926&color_dots=#161b22,#4d1115,#85141b,#c01822,#eb1926
            dist/snake-light.svg?palette=github-light&color_snake=#eb1926&color_dots=#ebedf0,#fcd5d8,#f79aa0,#ef5a64,#eb1926

      # The frames live on their own branch so they never clutter main's history.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
