<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="70" viewBox="0 0 1100 70" role="img" aria-label="04 SELECTED WORK"><title>04 SELECTED WORK</title><style>@font-face{font-family:L;src:url(data:font/woff2;base64,) format('woff2')}.L{font-family:L,Helvetica,Arial,sans-serif}@font-face{font-family:D;src:url(data:font/woff2;base64,) format('woff2')}.D{font-family:D,'Arial Black',Helvetica,sans-serif}
